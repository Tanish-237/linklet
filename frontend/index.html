<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS Safari zooms in on any focused field with text under 16px (the
      // chat box, search boxes) and stays zoomed. maximum-scale stops that;
      // iOS still allows pinch-zoom with it. Android would block pinch-zoom,
      // so it's added on iOS only.
      (function () {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var meta = ios && document.querySelector('meta[name="viewport"]');
        if (meta) meta.content += ", maximum-scale=1";
      })();
    </script>
    <meta name="theme-color" content="#f1f2f5" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a flash.
      // Mirrors src/theme/useThemeStore.js.
      (function () {
        var theme = "light";
        try {
          var pref = localStorage.getItem("linklet_theme");
          if (pref !== "light" && pref !== "dark") {
            pref = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          theme = pref;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0a0c" : "#f1f2f5");
      })();
    </script>
    <title>Linklet — Your campus, organized</title>
    <!--
      Generic fallback meta — shown to any crawler that doesn't execute JS
      (WhatsApp/iMessage/Slack link previews) and to any route the build-time
      prerender script (scripts/prerender.mjs) doesn't cover. Pages that ARE
      prerendered or that render their own <Helmet> override these; this is
      the floor everyone else gets instead of a bare, undescribed link.
    -->
    <meta
      name="description"
      content="Linklet is the campus platform built by MNNIT Allahabad students to organize schedules, share academic resources, and connect with classmates."
    />

    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

      content="Linklet is the campus platform built by MNNIT Allahabad students to organize schedules, share academic resources, and connect with classmates."
    />
    <meta name="twitter:image" content="https://linklet.org/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
