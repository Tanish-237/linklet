<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Linklet — Your campus, organized</title>
    <!--
      Generic fallback meta — shown to any crawler that doesn't execute JS
      (WhatsApp/iMessage/Slack link previews) and to any route the build-time
      prerender script (scripts/prerender.mjs) doesn't cover. Pages that ARE
      prerendered or that render their own <Helmet> override these; this is
      the floor everyone else gets instead of a bare, undescribed link.
    -->
    <meta
      name="description"
      content="Linklet is the campus platform built by MNNIT Allahabad students to organize schedules, share academic resources, and connect with classmates."
    />
    <meta property="og:title" content="Linklet — Your campus, organized" />
    <meta
      property="og:description"
      content="Linklet is the campus platform built by MNNIT Allahabad students to organize schedules, share academic resources, and connect with classmates."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://linklet.org" />
    <meta property="og:image" content="https://linklet.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Linklet — Your campus, organized" />
    <meta
      name="twitter:description"
      content="Linklet is the campus platform built by MNNIT Allahabad students to organize schedules, share academic resources, and connect with classmates."
    />
    <meta name="twitter:image" content="https://linklet.org/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
      link[rel="icon"] {
        border-radius: 50%;
        overflow: hidden;
      }
      html, body {
        background-color: #0a0a0a;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body style="background-color: #0a0a0a; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
