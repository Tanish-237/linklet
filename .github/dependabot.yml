# Weekly dependency update PRs, grouped so each week is one PR per app.
# CI (lint, tests, audit, build) runs on every one of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # v3 drops the server-render context that scripts/prerender.mjs reads
      # (React 19); upgrading means rewriting the prerender step.
      - dependency-name: react-helmet-async
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
