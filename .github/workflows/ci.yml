name: CI

# Runs lint + the full test suite for both the backend and frontend on every
# push and PR against main. Before this workflow existed, nothing verified
# that `main` actually passed its own tests — a broken commit could land
# undetected until it broke in production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The *.db.test.js suites run against a real in-memory MongoDB. The mongod
      # binary is downloaded once and cached, instead of on every CI run.
      - name: Cache mongod binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Run tests
        run: npm test

      - name: Audit for known-vulnerable dependencies
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5001

      - name: Audit for known-vulnerable dependencies
        run: npm audit --audit-level=high
